<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="0.8" />

  <!-- Main Sparkle / Wish Star -->
  <path d="M16 6 C16 11, 21 16, 26 16 C21 16, 16 21, 16 26 C16 21, 11 16, 6 16 C11 16, 16 11, 16 6 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)" />

  <!-- Small Accent Sparkle -->
  <path d="M23 7 C23 9, 25 10, 27 10 C25 10, 23 11, 23 13 C23 11, 21 10, 19 10 C21 10, 23 9, 23 7 Z" 
        fill="#ffffff" 
        opacity="0.9" />
</svg>
